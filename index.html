  <!-- PAGE PORTFOLIO (glissée dessous, révélée par la rotation) -->
  <section class="page page-portfolio">
    <iframe src="portfolio.html" class="cadre-portfolio" title="Portfolio"></iframe>
  </section>

</div>

<script>
  const enterBtn = document.getElementById('enterBtn');
  const wrapper = document.querySelector('.livre');
  const isDirectReturn = new URLSearchParams(window.location.search).has('return');

  const playReturnAnimation = () => {
    if (isDirectReturn) {
      wrapper.classList.add('est-retour');
      return;
    }

    if (sessionStorage.getItem('returningToCover') !== '1') {
      return;
    }

    sessionStorage.removeItem('returningToCover');
    wrapper.classList.add('est-ouvert');
    void wrapper.offsetWidth;
    requestAnimationFrame(() => {
      wrapper.classList.remove('est-ouvert');
    });
  };

  playReturnAnimation();
  window.addEventListener('pageshow', playReturnAnimation);

  enterBtn.addEventListener('click', () => {
    wrapper.classList.remove('est-retour');
    wrapper.classList.add('est-ouvert');
    sessionStorage.setItem('returningToCover', '1');
    setTimeout(() => {
      window.location.href = 'portfolio.html';
    }, 950);
  });
</script>
